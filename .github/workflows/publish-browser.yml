# Source refresh request: aislingin@86847608fcfa1af5403499b7000dd3da188ee050
# Source refresh request: aislingin@f726f1231fe923af549af392e14c58e05c221ef1
# Source refresh request: aislingin@5f09e9dc0bf51ffee4c841d177191f9cf08b0e5b
# Source refresh request: aislingin@c6141c482a6ec42ecf4d9fed5ad758a553f40c27
# Source refresh request: aislingin@ea4db07bb9ee7e9c8d0fefc3dfc467eab7b2c061

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch, tag, or commit from alocc911/aislingin"
        required: false
        type: string
        default: main
  push:
    paths:
      - .github/workflows/publish-browser.yml

permissions:
  contents: write

concurrency:
  group: sunnyslopes-browser-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Check out browser hosting repository
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: true

      - name: Check out game source
        uses: actions/checkout@v4
        with:
          repository: alocc911/aislingin
          ref: ${{ inputs.source_ref || 'main' }}
          path: source
          persist-credentials: false

      - name: Import and export browser game
        id: build
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.7.2.stable
          TARGET="$HOME/.local/share/godot/export_templates/$VERSION"
          SOURCE="/root/.local/share/godot/export_templates/$VERSION"
          if [ ! -d "$TARGET" ]; then
            mkdir -p "$(dirname "$TARGET")"
            cp -a "$SOURCE" "$TARGET"
          fi
          test -s "$TARGET/web_nothreads_release.zip"
          godot --headless --path "$GITHUB_WORKSPACE/source" --editor --import 2>&1 | tee "$GITHUB_WORKSPACE/godot-import.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' "$GITHUB_WORKSPACE/godot-import.log"; then
            echo "Refusing to publish: Godot import reported script errors."
            exit 1
          fi
          godot --headless --path "$GITHUB_WORKSPACE/source" --script res://scripts/DashboardUISelfTest.gd 2>&1 | tee "$GITHUB_WORKSPACE/ui-smoke-test.log"
          grep -Fq 'DashboardUISelfTest passed' "$GITHUB_WORKSPACE/ui-smoke-test.log"
          mkdir -p "$GITHUB_WORKSPACE/web-export"
          godot --headless --path "$GITHUB_WORKSPACE/source" --export-release "Web" "$GITHUB_WORKSPACE/web-export/index.html" 2>&1 | tee "$GITHUB_WORKSPACE/web-export.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' "$GITHUB_WORKSPACE/web-export.log"; then
            echo "Refusing to publish: Godot reported script errors."
            exit 1
          fi
          for required in index.html index.js index.pck index.wasm; do
            test -s "$GITHUB_WORKSPACE/web-export/$required"
          done
          SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)"
          printf 'Branch: %s\nCommit: %s\n' "${{ inputs.source_ref || 'main' }}" "$SOURCE_SHA" > "$GITHUB_WORKSPACE/web-export/BUILD_INFO.txt"
          echo "Export validated for aislingin@$SOURCE_SHA"

      - name: Insert opt-in WebGL probe before engine startup
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/site/webgl_probe.js"
          HTML="$GITHUB_WORKSPACE/web-export/index.html"
          grep -Fq '<script src="index.js"></script>' "$HTML"
          sed -i 's@<script src="index.js"></script>@<script src="webgl_probe.js"></script><script src="index.js"></script>@' "$HTML"
          grep -Fq '<script src="webgl_probe.js"></script>' "$HTML"
          echo "Installed optional pre-engine WebGL probe"
      - name: Replace browser files and commit to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/site"
          # Other completed runs may have updated main since this run was queued.
          git pull --ff-only origin "$GITHUB_REF_NAME"
          # Preserve workflow and other unrelated repository content.
          find . -maxdepth 1 -type f \( -name 'index.*' -o -name 'BUILD_INFO.txt' \) -delete
          cp -a "$GITHUB_WORKSPACE/web-export/." ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Published browser files are already up-to-date."
            exit 0
          fi
          SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/source" rev-parse --short=12 HEAD)"
          git commit -m "Publish SunnySlopes browser build from aislingin/$SOURCE_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "Updated newwebgame/$GITHUB_REF_NAME from aislingin/$SOURCE_SHA"

      - name: Record the browser build result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$GITHUB_WORKSPACE/site/.git" ]; then
            echo "Site checkout is unavailable; cannot persist build status."
            exit 0
          fi
          cd "$GITHUB_WORKSPACE/site"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          SOURCE_SHA="unavailable"
          if [ -d "$GITHUB_WORKSPACE/source/.git" ]; then
            SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)"
          fi
          printf 'Source: %s\nGodot build and UI self-test: %s\nBrowser publication: %s\nWorkflow run: %s\n' \
            "$SOURCE_SHA" '${{ steps.build.outcome }}' '${{ steps.publish.outcome }}' \
            '${{ github.run_id }}' > UI_BUILD_STATUS.txt
          if [ -f "$GITHUB_WORKSPACE/ui-smoke-test.log" ]; then
            printf '\nUI smoke test output:\n' >> UI_BUILD_STATUS.txt
            tail -n 25 "$GITHUB_WORKSPACE/ui-smoke-test.log" >> UI_BUILD_STATUS.txt
          fi
          if [ -f "$GITHUB_WORKSPACE/godot-import.log" ] && grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' "$GITHUB_WORKSPACE/godot-import.log"; then
            printf '\nGodot import errors:\n' >> UI_BUILD_STATUS.txt
            grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:' "$GITHUB_WORKSPACE/godot-import.log" | tail -n 25 >> UI_BUILD_STATUS.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UI_BUILD_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record browser UI build verification status"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
